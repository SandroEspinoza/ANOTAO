<div class="app-layout" *ngIf="authService.isAuthenticated()">
  <app-navbar 
    [tabActiva]="tabActiva()"
    (cambiarTab)="cambiarTab($event)"
    (abrirModalPrestamo)="mostrarModal.set(true)">
  </app-navbar>

  <main class="content-viewport">
    <app-loan-list 
      *ngIf="tabActiva() === 'prestamos'" 
      (abrirModal)="mostrarModal.set(true)"
      (irAResumen)="cambiarTab('dashboard')">
    </app-loan-list>

    <app-dashboard 
      *ngIf="tabActiva() === 'dashboard'"
      (irAPrestamos)="cambiarTab('prestamos')">
    </app-dashboard>
  </main>

  <app-loan-form 
    *ngIf="mostrarModal()" 
    (cerrar)="mostrarModal.set(false)">
  </app-loan-form>
</div>

<!-- Pantalla de Login / Registro cuando no hay sesión activa -->
<app-login *ngIf="!authService.isAuthenticated()"></app-login>
